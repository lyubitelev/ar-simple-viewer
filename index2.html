<!doctype html>
<html lang="ru">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>АРТ ВИЖН ТЕХ</title>
    <!-- Лендинг переехал на ./index.html. Страница оставлена только как
         редирект, чтобы старые ссылки и QR-коды продолжали работать. -->
    <link rel="canonical" href="./index.html">
    <meta name="robots" content="noindex">
    <meta http-equiv="refresh" content="0; url=./index.html">
</head>

<body>
    <p>Страница переехала на <a href="./index.html">./index.html</a>.</p>
    <script>
        // Сохраняем query и якорь, которых meta refresh не переносит.
        location.replace('./index.html' + location.search + location.hash);
    </script>
</body>

</html>
